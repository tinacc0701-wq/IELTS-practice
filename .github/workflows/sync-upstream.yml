name: Sync upstream

on:
  schedule:
    - cron: '0 18 * * 0' # 每週日 UTC 18:00（台灣時間週一 02:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'tinacc0701-wq/IELTS-practice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream main
        run: |
          git remote add upstream https://github.com/sallowayma-git/IELTS-practice.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          # .github/workflows is always kept as in this fork: GITHUB_TOKEN cannot
          # push workflow changes, and upstream CI edits would conflict with our
          # own ci.yml. So merge without committing, then restore that directory.
          if ! git merge upstream/main --no-commit --no-ff; then
            conflicts="$(git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/' || true)"
            if [ -n "$conflicts" ]; then
              echo "::error::Unresolved merge conflicts outside .github/workflows:"
              echo "$conflicts"
              exit 1
            fi
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git rm -rfq --ignore-unmatch .github/workflows
            git checkout HEAD -- .github/workflows
            git commit -m "chore: sync upstream/main"
          fi
          after="$(git rev-parse HEAD)"
          echo "before=$before after=$after"

          git push origin main
